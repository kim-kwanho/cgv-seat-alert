name: CGV seat alert

on:
  schedule:
    # UTC. KST = UTC+9 → 매 5분
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: cgv-seat-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare config
        run: |
          if [ ! -f config.json ]; then
            cp config.example.json config.json
          fi

      - name: Restore previous seat state
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: cgv-state-${{ github.run_id }}
          restore-keys: |
            cgv-state-

      - name: Check remaining seats once
        env:
          # 알림 (Secrets)
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 감시할 상영 — Repo Variables 권장 (Settings → Variables)
          THEATER_CODE: ${{ vars.THEATER_CODE }}
          THEATER_KEYWORD: ${{ vars.THEATER_KEYWORD }}
          THEATER_NAME: ${{ vars.THEATER_NAME }}
          MOVIE_CODE: ${{ vars.MOVIE_CODE }}
          MOVIE_NAME: ${{ vars.MOVIE_NAME }}
          PLAY_DATE: ${{ vars.PLAY_DATE }}
          START_TIME: ${{ vars.START_TIME }}
          ALERT_SOURCE: Actions
        run: python monitor.py --once

      - name: Save seat state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: cgv-state-${{ github.run_id }}
